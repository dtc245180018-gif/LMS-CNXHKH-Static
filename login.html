<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#102445">
  <title>Đăng nhập • ICTU Learn</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-brand">
      <a class="brand auth-brand-link" href="index.html"><span class="brand-icon">✦</span><span><strong>ICTU<span class="brand-light">LEARN</span></strong><small>LEARNING MANAGEMENT SYSTEM</small></span></a>
      <div class="auth-intro"><div class="eyebrow">KHÔNG GIAN HỌC TẬP</div><h1>Học tập chủ động,<br>tiến bộ mỗi ngày.</h1><p>Đăng nhập để tiếp tục luyện tập và theo dõi kết quả học tập của bạn.</p></div>
      <div class="auth-decoration">✦</div>
    </section>
    <section class="auth-panel">
      <div class="auth-card">
        <div class="eyebrow">CHÀO MỪNG TRỞ LẠI</div>
        <h2>Đăng nhập tài khoản</h2>
        <p class="subtle">Nhập thông tin để truy cập hệ thống.</p>
        <form id="login-form" novalidate>
          <label class="form-label" for="username">Tên đăng nhập</label>
          <input class="form-input" id="username" name="username" autocomplete="username" required placeholder="Ví dụ: student">
          <label class="form-label" for="password">Mật khẩu</label>
          <input class="form-input" id="password" name="password" type="password" autocomplete="current-password" required placeholder="Nhập mật khẩu">
          <p class="form-error" id="login-error" role="alert"></p>
          <button class="btn btn-primary btn-lg full" type="submit">Đăng nhập →</button>
        </form>
      </div>
      <p class="developer-credit">Dev by Ngọc Thắng <span class="verified-badge" aria-label="Đã xác minh">✓</span></p>
    </section>
  </main>
  <script src="auth.js"></script>
  <script>
    const form = document.getElementById('login-form');
    const error = document.getElementById('login-error');
    form.addEventListener('submit', event => {
      event.preventDefault();
      const username = form.username.value.trim();
      const password = form.password.value;
      const user = ICTUAuth.readUsers().find(item => item.username.toLowerCase() === username.toLowerCase() && item.password === password && item.status === 'active');
      if (!user) { error.textContent = 'Tên đăng nhập hoặc mật khẩu không đúng.'; return; }
      ICTUAuth.setSession(user);
      window.location.href = user.role === 'admin' ? 'admin.html' : 'index.html';
    });
  </script>
</body>
</html>
